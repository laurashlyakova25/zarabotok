<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой заработок</title>
<meta name="description" content="Личный учёт смен, апселлов и зарплаты">
<meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Заработок">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Tenor+Sans&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
/* Layout: боковое меню на компьютере, нижняя навигация на телефоне; кремовая основа, тёмно-зелёный акцент, графит */
:root {
  --bg: #F6F2E9;
  --surface: #FFFDF8;
  --surface-2: #EFEADF;
  --line: #E2DBCC;
  --fg: #1E2321;
  --muted: #69706A;
  --faint: #9AA099;
  --accent: #1E4A37;
  --accent-ink: #FBF8F1;
  --accent-soft: #E1EBE2;
  --graphite: #2A302D;
  --graphite-ink: #F3EFE6;
  --good: #23704A; --good-soft: #DFEEE3;
  --warn: #946112; --warn-soft: #F5E9CF;
  --bad: #A2412F; --bad-soft: #F6E1DB;
  --info: #3A5568; --info-soft: #E2E9EE;
  --s1: #16784F; --s2: #C27A1E;
  --shadow: 0 1px 2px rgba(30,35,33,.05), 0 6px 24px -12px rgba(30,35,33,.18);
  --ff-display: "Tenor Sans", "Iowan Old Style", Georgia, serif;
  --ff-ui: "Onest", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ff-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181D1A; --surface-2: #20261F; --line: #2C332E; --fg: #ECE8DF; --muted: #A0A69F; --faint: #6F766F;
  --accent: #7DBF9C; --accent-ink: #0F1A14; --accent-soft: #1E3328; --graphite: #E6E1D6; --graphite-ink: #151916;
  --good: #7DC69A; --good-soft: #1C3226; --warn: #E2B25C; --warn-soft: #382C14; --bad: #EE8C77; --bad-soft: #3A1F1A; --info: #9DB8CC; --info-soft: #1E2A33;
  --s1: #2B9567; --s2: #BF7A22; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -14px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181D1A; --surface-2: #20261F; --line: #2C332E; --fg: #ECE8DF; --muted: #A0A69F; --faint: #6F766F;
  --accent: #7DBF9C; --accent-ink: #0F1A14; --accent-soft: #1E3328; --graphite: #E6E1D6; --graphite-ink: #151916;
  --good: #7DC69A; --good-soft: #1C3226; --warn: #E2B25C; --warn-soft: #382C14; --bad: #EE8C77; --bad-soft: #3A1F1A; --info: #9DB8CC; --info-soft: #1E2A33;
  --s1: #2B9567; --s2: #BF7A22; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -14px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ff-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .tab { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--ff-mono); }
h1, h2, h3 { font-family: var(--ff-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.1; }
h2 { font-size: 21px; line-height: 1.2; }
h3 { font-size: 17px; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== Каркас ===== */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; padding: 24px 16px; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--ff-display); font-size: 17px; }
.brand-name { font-family: var(--ff-display); font-size: 17px; line-height: 1.1; }
.brand-sub { font-size: 11.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 19px; height: 19px; flex: none; }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.ok { background: var(--good); } .dot.busy { background: var(--warn); } .dot.err { background: var(--bad); }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
@media (min-width: 900px) { .main { padding-left: 36px; padding-right: 36px; } }

.bottom { display: none; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-block: 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
  .bottom { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottom a, .bottom button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 10.5px; color: var(--muted); text-decoration: none; background: none; border: 0; border-radius: 12px; font-weight: 500; }
  .bottom a.on, .bottom button.on { color: var(--accent); }
  .bottom svg { width: 22px; height: 22px; }
}

/* ===== Шапка раздела ===== */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.head-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.head-r { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.monthsw { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.monthsw button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.monthsw button:hover { background: var(--surface-2); color: var(--fg); }
.monthsw .lbl { min-width: 128px; text-align: center; font-weight: 600; font-size: 14px; padding: 0 4px; cursor: pointer; border: 0; background: none; }

/* ===== Кнопки ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--faint); }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.dark { background: var(--graphite); border-color: var(--graphite); color: var(--graphite-ink); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.sm { height: 34px; padding: 0 13px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.danger:hover { color: var(--bad); background: var(--bad-soft); }
.icon-btn svg { width: 17px; height: 17px; }

/* ===== Карточки и плитки ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .g3, .g2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 380px) { .g4 { grid-template-columns: minmax(0, 1fr); } }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .k { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.tile .k svg { width: 15px; height: 15px; }
.tile .v { font-family: var(--ff-display); font-size: clamp(21px, 2.6vw, 26px); line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.hero .k, .tile.hero .s { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
.tile.ink { background: var(--graphite); border-color: var(--graphite); color: var(--graphite-ink); }
.tile.ink .k, .tile.ink .s { color: color-mix(in srgb, var(--graphite-ink) 70%, transparent); }

.half { display: flex; flex-direction: column; gap: 14px; }
.half-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.half-range { font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px 14px; align-items: baseline; }
.kv dt { color: var(--muted); font-size: 14px; }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.kv .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 3px 0; }
.kv .total dt { color: var(--fg); font-weight: 600; }
.kv .total { display: contents; }
.kv dd.big { font-family: var(--ff-display); font-size: 22px; font-weight: 400; }
.net-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); gap: 10px; flex-wrap: wrap; }
.net-row .v { font-family: var(--ff-display); font-size: 26px; font-variant-numeric: tabular-nums; }

/* ===== Пилюли ===== */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.plain::before { display: none; }
.tag-hol { background: var(--warn-soft); color: var(--warn); }

/* ===== Списки ===== */
.rows { display: flex; flex-direction: column; }
.row { display: grid; align-items: center; gap: 6px 14px; padding: 13px 4px; border-top: 1px solid var(--line); min-width: 0; }
.rows > .row:first-child { border-top: 0; }
.row-shift { grid-template-columns: 74px minmax(0, 1.4fr) minmax(0, 1fr) auto auto; }
.row-ups { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.2fr) auto 120px auto; }
.row-pay { grid-template-columns: 110px minmax(0, 1fr) auto auto; }
.date-box { display: flex; flex-direction: column; line-height: 1.1; }
.date-box b { font-family: var(--ff-display); font-weight: 400; font-size: 22px; }
.date-box span { font-size: 12px; color: var(--muted); }
.cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cell .t { font-weight: 600; overflow-wrap: anywhere; }
.cell .d { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.amount .d { font-weight: 400; font-size: 12px; color: var(--muted); display: block; }
.acts { display: flex; gap: 2px; justify-content: flex-end; }
.booking { font-family: var(--ff-mono); font-weight: 600; font-size: 15px; letter-spacing: .02em; background: var(--surface-2); padding: 3px 8px; border-radius: 7px; display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
@media (max-width: 760px) {
  .row-shift { grid-template-columns: 54px minmax(0, 1fr) auto; }
  .row-shift .c-type { grid-column: 2; grid-row: 2; }
  .row-shift .acts { grid-column: 3; grid-row: 2; }
  .row-ups { grid-template-columns: minmax(0, 1fr) auto; }
  .row-ups .c-main { grid-column: 1; grid-row: 1; }
  .row-ups .c-amt { grid-column: 2; grid-row: 1; }
  .row-ups .c-mid { grid-column: 1; grid-row: 2; }
  .row-ups .c-status { grid-column: 2; grid-row: 2; justify-self: end; }
  .row-ups .acts { grid-column: 1 / -1; grid-row: 3; margin-top: -6px; }
  .row-pay { grid-template-columns: minmax(0, 1fr) auto; }
  .row-pay .acts { grid-column: 2; }
}

.empty { text-align: center; padding: 34px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty svg { width: 34px; height: 34px; color: var(--faint); }

/* ===== Тулбар / поля ===== */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lab { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.inp, select.inp, textarea.inp { height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 13px; width: 100%; min-width: 0; font-size: 16px; }
textarea.inp { height: auto; min-height: 76px; padding: 10px 13px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.err { border-color: var(--bad); }
.inp.sm { height: 38px; font-size: 14px; border-radius: 10px; }
.inp.mono { font-family: var(--ff-mono); letter-spacing: .02em; }
.toolbar .inp { width: auto; }
.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search .inp { width: 100%; padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form { grid-template-columns: minmax(0, 1fr); } .form .half-w { grid-column: 1 / -1; } }
.hint { font-size: 12.5px; color: var(--muted); }
.ferr { font-size: 12.5px; color: var(--bad); }

.seg { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 12px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: 500; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.calc { background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 16px; }
.calc .k { font-size: 12px; color: var(--muted); }
.calc .v { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 16px; }
.note { padding: 12px 14px; border-radius: 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
.note svg { width: 17px; height: 17px; flex: none; margin-top: 1px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.info { background: var(--info-soft); color: var(--info); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.good { background: var(--good-soft); color: var(--good); }

/* ===== Календарь ===== */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .wd { font-size: 11.5px; color: var(--muted); text-align: center; padding-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
.cal .day { min-height: 86px; border: 1px solid var(--line); border-radius: 12px; padding: 7px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); cursor: pointer; text-align: left; min-width: 0; }
.cal .day:hover { border-color: var(--faint); }
.cal .day.out { visibility: hidden; }
.cal .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .day.hol .dn { color: var(--warn); }
.cal .day.split { border-top: 3px solid var(--graphite); }
.cal .dn { font-size: 13px; font-weight: 600; }
.cal .sh { font-size: 11.5px; border-radius: 7px; padding: 3px 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cal .sh.h { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 640px) { .cal { gap: 3px; } .cal .day { min-height: 58px; padding: 4px; border-radius: 9px; } .cal .sh { font-size: 10px; padding: 2px 3px; } .cal .sh .tm { display: none; } }

/* ===== Таблицы ===== */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th.n, .tbl td.n { text-align: right; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tfoot td { font-weight: 600; border-top: 1px solid var(--line); }

/* ===== Графики ===== */
.chart-box { position: relative; height: 240px; }
.chart-box.tall { height: 290px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ===== Модальные окна ===== */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(17, 21, 19, .42); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease; }
.modal { width: min(620px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.modal.narrow { width: min(440px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 6px; gap: 10px; }
.modal-b { padding: 14px 22px 8px; display: flex; flex-direction: column; gap: 16px; }

@media (max-width: 640px) {
  .overlay { align-items: flex-end; padding: 0; }
  .modal { width: 100%; border-radius: 22px 22px 0 0; max-height: calc(100dvh - 24px - env(safe-area-inset-top, 0px)); }
  .modal-f { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .modal-f .btn { flex: 1 1 auto; }
}
@keyframes fade { from { opacity: 0 } }

.toasts { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
@media (min-width: 900px) { .toasts { bottom: 28px; } }
.toast { background: var(--graphite); color: var(--graphite-ink); padding: 11px 16px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow); pointer-events: auto; animation: fade .2s ease; }
.toast.err { background: var(--bad); color: var(--surface); }

/* ===== Экраны загрузки / приветствия ===== */
.center-screen { min-height: 70vh; display: grid; place-items: center; }
.welcome { max-width: 560px; width: 100%; display: flex; flex-direction: column; gap: 18px; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.hist { display: flex; flex-direction: column; }

.pdf-sheet { position: fixed; left: -10000px; top: 0; width: 794px; background: #fff; color: #1E2321; padding: 40px; font-family: var(--ff-ui); font-size: 12px; }

/* ===== Главная: одна главная сумма, компактная статистика, начисления по периодам ===== */
:root { --hero-bg: #1E4A37; --hero-ink: #FBF8F1; --r-lg: 16px; --r-md: 12px; }

.hero-sub > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }

.hero-note { margin-top: 10px; font-size: 13px; color: color-mix(in srgb, var(--hero-ink) 75%, transparent); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }

}

.periods, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px 6px; min-width: 0; }

  .prow-head { display: none; }

  .prow .pname { grid-area: name; }
  .prow .pv.net { grid-area: net; font-size: 17px; }

/* ===== Статусы смен ===== */

@media (max-width: 760px) { .row-shift.is-plan .acts { grid-column: 1 / -1; grid-row: 3; justify-content: flex-end; } }
.brand-mark { object-fit: cover; padding: 0; }

<body>
<div id="root"></div>
<div id="modals"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
/* ===== Расчётное ядро. Все деньги — целые копейки, время — целые минуты. ===== */
(function (root) {
  'use strict';

  // Округление до целого «половина вверх» с защитой от ошибок двоичной дроби
  function rnd(x) {
    if (!isFinite(x)) return 0;
    var s = x < 0 ? -1 : 1;
    return s * Math.round(Math.abs(x) + 1e-7);
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function parseTime(t) {
    if (typeof t !== 'string') return null;
    var m = /^(\d{1,2}):(\d{2})$/.exec(t.trim());
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }

  // Длительность смены: окончание − начало − перерыв, с переходом через полночь
  function shiftSpan(start, end) {
    var s = parseTime(start), e = parseTime(end);
    if (s === null || e === null) return null;
    var span = e - s;
    if (span <= 0) span += 1440; // окончание после полуночи
    return span;
  }

  function shiftMinutes(start, end, breakMin) {
    var span = shiftSpan(start, end);
    if (span === null) return { ok: false, error: 'Укажите время в формате ЧЧ:ММ' };
    var b = Math.max(0, Math.round(+breakMin || 0));
    if (b >= span) return { ok: false, error: 'Перерыв не может быть равен или больше длительности смены' };
    return { ok: true, span: span, total: span - b, crossesMidnight: (parseTime(end) <= parseTime(start)) };
  }

  // Разделение на обычные и праздничные минуты
  function splitMinutes(shift) {
    var total = shift.totalMin | 0;
    var hol = 0;
    if (shift.type === 'holiday') hol = total;
    else if (shift.type === 'partial') hol = Math.min(total, Math.max(0, shift.holidayMin | 0));
    return { regular: total - hol, holiday: hol, total: total };
  }

  // Подсказка: сколько минут смены приходится на праздничные даты (перерыв вычитается из обычной части)
  function suggestHolidayMinutes(date, start, end, breakMin, holidaySet) {
    var sm = shiftMinutes(start, end, breakMin);
    if (!sm.ok) return null;
    var s = parseTime(start);
    var firstDayLeft = Math.min(sm.span, 1440 - s);
    var secondDay = sm.span - firstDayLeft;
    var d2 = addDays(date, 1);
    var holRaw = (holidaySet[date] ? firstDayLeft : 0) + (holidaySet[d2] ? secondDay : 0);
    if (holRaw === 0) return { type: 'regular', holidayMin: 0 };
    if (holRaw >= sm.span) return { type: 'holiday', holidayMin: sm.total };
    var hol = Math.min(holRaw, sm.total);
    return { type: 'partial', holidayMin: hol };
  }

  // ===== Даты =====
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(iso, n) { var d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function daysInMonth(month) { var p = month.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
  function monthOf(iso) { return iso.slice(0, 7); }
  function addMonths(month, n) {
    var p = month.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }

  function periodOf(iso, splitDay) {
    var day = +iso.slice(8, 10);
    return { month: monthOf(iso), half: day <= splitDay ? 1 : 2 };
  }
  function periodRange(month, half, splitDay) {
    var last = daysInMonth(month);
    var sd = Math.min(splitDay, last - 1);
    return half === 1
      ? { from: month + '-01', to: month + '-' + pad(sd) }
      : { from: month + '-' + pad(sd + 1), to: month + '-' + pad(last) };
  }
  function periodKey(month, half) { return month + '-' + half; }

  // Значение из истории на дату: последняя запись с from <= date; если раньше всех — самая ранняя
  function valueAt(history, iso) {
    if (!history || !history.length) return null;
    var sorted = history.slice().sort(function (a, b) { return a.from < b.from ? -1 : a.from > b.from ? 1 : (a.createdAt || 0) - (b.createdAt || 0); });
    var v = sorted[0].value;
    for (var i = 0; i < sorted.length; i++) { if (sorted[i].from <= iso) v = sorted[i].value; }
    return v;
  }

  // ===== Статусы смен =====
  // В заработок попадает только смена со статусом «Отработана» (done).
  // Старые записи без статуса считаются отработанными: сервер один раз проставляет им статус по времени.
  function shiftStartMs(s) { var p = s.date.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 0, 0, 0).getTime() + (parseTime(s.start) || 0) * 60000; }
  function shiftEndMs(s) { return shiftStartMs(s) + (shiftSpan(s.start, s.end) || 0) * 60000; }
  function isWorked(s) { return !s.status || s.status === 'done'; }
  // Для отображения: done, inprogress (идёт сейчас), awaiting (закончилась, но не подтверждена), planned
  function shiftState(s, now) {
    if (isWorked(s)) return 'done';
    now = now == null ? Date.now() : now;
    if (now >= shiftEndMs(s)) return 'awaiting';
    if (s.status === 'inprogress' || now >= shiftStartMs(s)) return 'inprogress';
    return 'planned';
  }
  function defaultStatus(s, now) { now = now == null ? Date.now() : now; return now >= shiftEndMs(s) ? 'done' : now >= shiftStartMs(s) ? 'inprogress' : 'planned'; }

  // ===== Деньги смены =====
  function shiftPay(shift) {
    var sp = splitMinutes(shift);
    var rate = shift.rate | 0, coef = +shift.coef || 0;
    var reg = rnd(sp.regular * rate / 60);
    var hol = rnd(sp.holiday * rate * coef / 60);
    return { regularMin: sp.regular, holidayMin: sp.holiday, totalMin: sp.total, regularPay: reg, holidayPay: hol, total: reg + hol };
  }

  function upsellReward(amountKop, mode, value) {
    if (mode === 'fixed') return rnd(+value || 0);           // value — копейки
    if (mode === 'percent') return rnd((amountKop | 0) * (+value || 0) / 100);
    return 0;
  }

  var COUNTED = { confirmed: 1, accrued: 1 };

  // ===== Период (половина месяца) =====
  function computePeriod(state, month, half) {
    var st = state.settings;
    var splitDay = st.splitDay || 15;
    var upsellHalf = 2; // апселлы месяца целиком входят во вторую половину, в первую — никогда
    var range = periodRange(month, half, splitDay);
    var key = periodKey(month, half);
    var pinfo = (state.periods && state.periods[key]) || {};

    // Группировка по (ставка, коэффициент): часы × ставка, как в формуле
    var groups = {};
    var shifts = [], worked = [], plannedMin = 0, plannedCount = 0, plannedPay = 0;
    (state.shifts || []).forEach(function (s) {
      if (s.date >= range.from && s.date <= range.to) {
        shifts.push(s);
        if (!isWorked(s)) { plannedCount++; plannedMin += s.totalMin | 0; plannedPay += shiftPay(s).total; return; }
        worked.push(s);
        var sp = splitMinutes(s);
        var g = s.rate + '|' + s.coef;
        if (!groups[g]) groups[g] = { rate: s.rate | 0, coef: +s.coef, reg: 0, hol: 0 };
        groups[g].reg += sp.regular; groups[g].hol += sp.holiday;
      }
    });
    var regularMin = 0, holidayMin = 0, regularPay = 0, holidayPay = 0;
    var rateLines = [];
    Object.keys(groups).forEach(function (k) {
      var g = groups[k];
      var rp = rnd(g.reg * g.rate / 60), hp = rnd(g.hol * g.rate * g.coef / 60);
      regularMin += g.reg; holidayMin += g.hol; regularPay += rp; holidayPay += hp;
      rateLines.push({ rate: g.rate, coef: g.coef, regularMin: g.reg, holidayMin: g.hol, regularPay: rp, holidayPay: hp });
    });
    var base = regularPay + holidayPay;

    var upsConfirmed = 0, upsPending = 0, upsCountConfirmed = 0, upsCountPending = 0, upsCancelled = 0;
    var upsells = [];
    if (half === upsellHalf) {
      (state.upsells || []).forEach(function (u) {
        if ((u.payMonth || monthOf(u.date)) !== month) return;
        upsells.push(u);
        if (COUNTED[u.status]) { upsConfirmed += u.reward | 0; upsCountConfirmed++; }
        else if (u.status === 'pending') { upsPending += u.reward | 0; upsCountPending++; }
        else if (u.status === 'cancelled') upsCancelled++;
      });
    }
    var accrued = base + upsConfirmed;

    var taxSource = 'history';
    var taxRate;
    if (pinfo.closed && pinfo.taxRateSnap != null) { taxRate = +pinfo.taxRateSnap; taxSource = 'closed'; }
    else if (pinfo.taxRateOverride != null && pinfo.taxRateOverride !== '') { taxRate = +pinfo.taxRateOverride; taxSource = 'override'; }
    else taxRate = +(valueAt(st.taxRates, range.to) || 0);
    var taxCalc = rnd(accrued * taxRate / 100);
    var manual = pinfo.taxManual != null && pinfo.taxManual !== '';
    var tax = manual ? (pinfo.taxManual | 0) : taxCalc;
    var net = accrued - tax;

    return {
      key: key, month: month, half: half, from: range.from, to: range.to,
      closed: !!pinfo.closed, shifts: shifts, workedShifts: worked, shiftCount: worked.length,
      plannedCount: plannedCount, plannedMin: plannedMin, plannedPay: plannedPay,
      regularMin: regularMin, holidayMin: holidayMin, totalMin: regularMin + holidayMin,

  var cur = E.valueAt(S.settings[key], todayISO());
  return '<div class="card stack"><div class="spread"><div><div class="eyebrow">' + title + '</div><div class="tile" style="border:0;padding:6px 0 0;background:none"><div class="v">' + fmt(cur) + '</div><div class="s">' + sub + '</div></div></div><button class="btn sm" data-act="hist-new" data-kind="' + kind + '">' + ic('plus') + 'Изменить</button></div>' +
    '<div class="hist">' + list.map(function (h) {
      return '<div><span><b style="font-variant-numeric:tabular-nums">' + fmt(h.value) + '</b> <span class="muted small">' + fromTxt(h.from) + '</span></span>' + (list.length > 1 ? '<button class="icon-btn danger" data-act="hist-del" data-kind="' + kind + '" data-id="' + h.id + '" aria-label="Удалить запись истории">' + ic('trash') + '</button>' : '') + '</div>';
    }).join('') + '</div></div>';
}

/* ===== Подключение устройства ===== */
function connectDevice() {
  var url = $('#c-url').value.trim(), key = $('#c-key').value.trim(), err = $('#c-err'), btn = $('#c-go');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return (err.textContent = 'Адрес должен выглядеть так: https://script.google.com/macros/s/…/exec');
  if (key.length < 20) return (err.textContent = 'Вставьте ключ целиком — он длинный, около 48 символов');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Проверяю…';
  apiCall({ url: url, key: key }, 'ping').then(function () {
    CONN = { url: url, key: key };
    if (!writeConn(CONN)) toast('Браузер не разрешил сохранить подключение — после перезапуска понадобится ввести ключ снова', 'err');
    S.loadErr = null; S.loadMsg = ''; render(); return reload(true);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = 'Подключить';
    err.textContent = e.code === 'unauthorized' ? 'Ключ не подошёл. Скопируйте его заново из журнала выполнения createApiKey.' : e.message === 'network' ? 'Нет связи с сервером. Проверьте адрес и что при развёртывании выбран доступ «Все».' : e.message;
  });
}

/* ===== Смена ===== */
function dayIdx(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
// Свободный ввод времени: «9», «930», «09:30», «21.15» → «ЧЧ:ММ»
function normTime(str) {
  var t = String(str || '').trim().replace(/[.,\-\s]/g, ':');
  var m = /^(\d{1,2}):?(\d{2})?$/.exec(t.indexOf(':') < 0 && t.length > 2 ? t.slice(0, t.length - 2) + ':' + t.slice(-2) : t);
  if (!m) return null;
  var h = +m[1], mi = m[2] ? +m[2] : 0;
  if (h === 24 && mi === 0) h = 0;
  if (h > 23 || mi > 59) return null;
  return E.pad(h) + ':' + E.pad(mi);
}
// Перерыв: «60» минут, «1:30», «1ч», «1,5 ч», «45 мин»
function parseBreak(str) {
  var t = String(str || '').trim().toLowerCase().replace(',', '.');
  if (t === '') return 0;
  var m;
  if ((m = /^(\d{1,2}):(\d{2})$/.exec(t))) return (+m[1]) * 60 + (+m[2]);
  if ((m = /^(\d+(?:\.\d+)?)\s*(ч|час|часа|часов|h)$/.exec(t))) return Math.round(+m[1] * 60);
  if ((m = /^(\d+)\s*(м|мин|min|m)?$/.exec(t))) return +m[1];
  return null;
}
var SHIFT_ST = { planned: 'Запланирована', inprogress: 'В процессе', done: 'Отработана' };
function openShift(s, date, confirm) {
  var isNew = !s;
  s = s || { date: date || todayISO(), start: '', end: '', breakMin: 60, type: 'regular', holidayMin: 0, comment: '' };

function fileStamp() { var ms = expMonths(); return ms.length === 1 ? ms[0] : ms[0] + '_' + ms[ms.length - 1]; }
function mimeOf(name) { var e = name.split('.').pop(); return { xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv: 'text/csv', pdf: 'application/pdf', json: 'application/json' }[e] || 'application/octet-stream'; }
// Файл готов: скачать на устройство или сохранить в Google Диск
function saveFile(filename, data) {
  var blob = data instanceof Blob ? data : new Blob([data], { type: mimeOf(filename) + ';charset=utf-8' });
  var url = URL.createObjectURL(blob);
  return new Promise(function (resolve) {
    var html = mHead('Файл готов', esc(filename) + ' · ' + Math.max(1, Math.round(blob.size / 1024)) + ' КБ') + '<div class="modal-b"><div class="list-plain">' +
      '<a class="btn pri" id="sv-dl" href="' + url + '" download="' + esc(filename) + '">' + ic('download') + 'Скачать на устройство</a>' +
      '<button class="btn" id="sv-drive" type="button">' + ic('upload') + 'Сохранить в Google Диск</button></div><div id="sv-res"></div>' +
      '<div class="hint">Если скачивание на iPhone не началось, сохраните файл в Google Диск — он появится в папке «Мой заработок — экспорт».</div></div><div class="modal-f"><button class="btn" data-close type="button">Закрыть</button></div>';
    var done = false;
    var ov = openModal(html, { narrow: true, onMount: function (ov) {
      $('#sv-dl', ov).addEventListener('click', function () { done = true; setTimeout(function () { toast('Файл скачивается: ' + filename); }, 50); });
      $('#sv-drive', ov).onclick = function () {
        var btn = this; btn.disabled = true; btn.textContent = 'Сохраняю…';
        var rd = new FileReader();
        rd.onload = function () {
          gs('saveToDrive', filename, String(rd.result).split(',')[1], mimeOf(filename)).then(function (txt) {
            var r = JSON.parse(txt); done = true;
            $('#sv-res', ov).innerHTML = '<div class="note good">' + ic('shield') + '<div>Сохранено в Google Диск: <a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a></div></div>';
            btn.textContent = 'Сохранено';
          }).catch(function (e) { btn.disabled = false; btn.textContent = 'Сохранить в Google Диск'; toast(errText(e), 'err'); });
        };
        rd.readAsDataURL(blob);
      };
    } });
    ov._onClose = function () { setTimeout(function () { URL.revokeObjectURL(url); }, 60000); resolve(done); };
  });
}
function selectedSets() { var s = S.ui.exp.sets; return ['shifts', 'upsells', 'salary', 'payments'].filter(function (k) { return s[k]; }); }

function exportXlsx() {
  var sets = selectedSets(); if (!sets.length) return toast('Выберите хотя бы одну таблицу');
  toast('Готовлю Excel…');
  loadLib(LIB.xlsx).then(function () {
    var X = window.XLSX, wb = X.utils.book_new(), months = expMonths();
    sets.forEach(function (k) {
      var d = dataset(k, months), aoa = [d.head].concat(d.rows);
      if (d.summary) { aoa.push([], ['Сверка по периодам'], d.summary.head); aoa = aoa.concat(d.summary.rows); }
      var ws = X.utils.aoa_to_sheet(aoa);
      ws['!cols'] = d.cols.map(function (w) { return { wch: w }; });
      // денежный формат для числовых ячеек с деньгами
      var range = X.utils.decode_range(ws['!ref']);
      for (var r = 1; r <= range.e.r; r++) for (var c = 0; c <= range.e.c; c++) {
        var cell = ws[X.utils.encode_cell({ r: r, c: c })];
        if (cell && cell.t === 'n') cell.z = (d.money.indexOf(c) >= 0 || (d.summary && r > d.rows.length + 2 && c >= 1 && c <= 3)) ? '#,##0.00' : (Number.isInteger(cell.v) ? '0' : '0.00');
      }
      if (k === 'upsells') for (var rr = 1; rr <= d.rows.length; rr++) { var bc = ws[X.utils.encode_cell({ r: rr, c: 0 })]; if (bc) { bc.t = 's'; bc.z = '@'; } }
      X.utils.book_append_sheet(wb, ws, d.name);
    });
    var buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
    return saveFile('Зарплата_' + fileStamp() + '.xlsx', new Blob([buf]));
  }).catch(function () { toast('Не удалось загрузить модуль Excel. Проверьте интернет и повторите.', 'err'); });
}
function csvCell(v) {
  if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ',');
  var s = String(v == null ? '' : v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv(kind) {
  var d = dataset(kind, expMonths());
  var lines = [d.head].concat(d.rows).map(function (r) { return r.map(csvCell).join(';'); });
  saveFile(d.name.replace(/\s/g, '_') + '_' + fileStamp() + '.csv', '﻿' + lines.join('\r\n'));
}
function exportPdf() {

      '<table style="margin-top:14px"><tr><th>Часы</th><th class="n">Апселлы</th><th class="n">Начислено</th><th class="n">Налог</th><th class="n">На руки</th></tr><tr><td>' + hrs(tot.min) + '</td><td class="n">' + money(tot.ups, 1) + '</td><td class="n">' + money(tot.accrued, 1) + '</td><td class="n">' + money(tot.tax, 1) + '</td><td class="n"><b>' + money(tot.net, 1) + '</b></td></tr></table>';

      if (d.summary && d.summary.rows.length) html += '<table style="margin-top:10px"><tr>' + d.summary.head.map(function (h, i) { return '<th' + (i && i < 4 ? ' class="n"' : '') + '>' + h + '</th>'; }).join('') + '</tr>' + d.summary.rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="n">' + money(Math.round(r[1] * 100), 1) + '</td><td class="n">' + money(Math.round(r[2] * 100), 1) + '</td><td class="n">' + money(Math.round(r[3] * 100), 1) + '</td><td>' + r[4] + '</td></tr>'; }).join('') + '</table>';
    });
    sheet.innerHTML = html; document.body.appendChild(sheet);
    return (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { return window.html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff' }); }).then(function (canvas) {
      sheet.remove();
      var pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
      var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      var pxPerPt = canvas.width / pw, pagePx = Math.floor(ph * pxPerPt), y = 0, first = true;
      while (y < canvas.height) {
        var h = Math.min(pagePx, canvas.height - y), part = document.createElement('canvas'); part.width = canvas.width; part.height = h;
        part.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);

  }).catch(function () { toast('Не удалось сформировать PDF. Проверьте интернет и повторите.', 'err'); });
}

function restoreBackup(file) {
  var rd = new FileReader();
  rd.onload = function () {
    var b; try { b = JSON.parse(rd.result); } catch (e) { return toast('Файл не похож на выгрузку данных', 'err'); }
    if (!b || b.format !== 'salary-tracker-backup' || !b.settings) return toast('Это не выгрузка приложения «Мой заработок»', 'err');
    var cnt = (b.shifts || []).length + ' смен, ' + (b.upsells || []).length + ' апселлов, ' + (b.payments || []).length + ' выплат';
    ask({ title: 'Восстановить данные?', text: 'Выгрузка от ' + dShort((b.exportedAt || '').slice(0, 10)) + ': ' + cnt + '.<p class="muted small">«Объединить» добавит и обновит записи из файла. «Заменить всё» удалит записи, которых нет в файле. Перед восстановлением в Google Диске создаётся страховочная копия таблицы.</p>',
      buttons: [{ key: 'merge', label: 'Объединить' }, { key: 'replace', label: 'Заменить всё', cls: 'danger solid' }] }).then(function (mode) {
      if (!mode) return;
      if (S.pending) return toast('Дождитесь сохранения изменений и повторите');

      gs('restoreAll', rd.result, mode).then(function () { return reload(true); }).then(function () { toast('Данные восстановлены'); }).catch(function (e) { toast(errText(e), 'err'); });
    });
  };
  rd.readAsText(file);
}
